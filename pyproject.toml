[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpulse"
version = "0.1.0"
description = "Netherlands electricity load analytics and forecast evaluation"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pyarrow",
]

[tool.setuptools.packages.find]
where = ["src"]
